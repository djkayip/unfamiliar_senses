<svg xmlns="http://www.w3.org/2000/svg" width="560" height="620" viewBox="0 0 560 620" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <title>움벨트: 생물마다 다른 둘레세계</title>
  <desc>위: 윅스퀼의 기능 고리. 진드기는 포유류의 땀 냄새·체온·털의 촉감이라는 세 신호만 지각하고, 떨어지기·기어 다니기·피 빨기로 작용한다. 이 세 신호 밖의 세계는 진드기에게 없다. 아래: 에드 용의 사고 실험. 같은 체육관 안에서도 사람·박쥐·방울뱀·뒤영벌·진드기는 저마다 다른 세계를 지각한다.</desc>
  <defs>
    <marker id="uw-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7dc4dd"/></marker>
    <marker id="uw-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9a8fe0"/></marker>
  </defs>

  <!-- ── 위: 진드기의 기능 고리 ── -->
  <circle cx="108" cy="164" r="60" fill="#9a8fe0" fill-opacity="0.1" stroke="#9a8fe0" stroke-opacity="0.8" stroke-width="1.6"/>
  <g transform="translate(86.0 128.0) scale(1.833)" fill="none" stroke="#9a8fe0" stroke-width="0.98" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="14" rx="5" ry="6.5"/><circle cx="12" cy="6" r="1.8"/><path d="M7.5 10.5 L3.5 8.5"/><path d="M7 13 L3 13"/><path d="M7.3 15.8 L3.5 17.8"/><path d="M8.5 18.6 L5.5 21.5"/><path d="M16.5 10.5 L20.5 8.5"/><path d="M17 13 L21 13"/><path d="M16.7 15.8 L20.5 17.8"/><path d="M15.5 18.6 L18.5 21.5"/></g>
  <text x="108" y="196" font-size="15" font-weight="700" fill="#9a8fe0" text-anchor="middle">진드기</text>
  <text x="108" y="213" font-size="11" fill="#85858f" text-anchor="middle">주체</text>

  <circle cx="452" cy="164" r="60" fill="#7dc4dd" fill-opacity="0.1" stroke="#7dc4dd" stroke-opacity="0.8" stroke-width="1.6"/>
  <g transform="translate(404.0 132.0) scale(1.000)" fill="none" stroke="#7dc4dd" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9.5c0 0-4.3 5-4.3 8a4.3 4.3 0 0 0 8.6 0c0-3-4.3-8-4.3-8z"/><path d="M7 6.5c-1-1 .2-2.2-.6-3.4"/><path d="M12 5.5c-1-1 .2-2.2-.6-3.4"/><path d="M17 6.5c-1-1 .2-2.2-.6-3.4"/></g> <g transform="translate(440.0 132.0) scale(1.000)" fill="none" stroke="#7dc4dd" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14V5a2 2 0 0 1 4 0v9a4 4 0 1 1-4 0z"/><path d="M12 9v7"/></g> <g transform="translate(476.0 132.0) scale(1.000)" fill="none" stroke="#7dc4dd" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19.5Q12 16.5 21 19.5"/><path d="M6 18.6Q4.6 13 6.8 7.5"/><path d="M10 17.8Q8.8 12 11 5.5"/><path d="M14 17.8Q12.8 12 15 6"/><path d="M18 18.6Q16.8 13.4 18.8 8.5"/></g>
  <g font-size="10" fill="#85858f" text-anchor="middle"><text x="416" y="170">땀 냄새</text><text x="452" y="170">체온</text><text x="488" y="170">털</text></g>
  <text x="452" y="196" font-size="15" font-weight="700" fill="#7dc4dd" text-anchor="middle">포유류</text>
  <text x="452" y="212" font-size="11" fill="#85858f" text-anchor="middle">대상</text>

  <path d="M426 110 C 400 44, 160 44, 134 108" fill="none" stroke="#7dc4dd" stroke-width="2.2" stroke-linecap="round" marker-end="url(#uw-t)"/>
  <g text-anchor="middle">
    <text x="280" y="34" font-size="15" font-weight="700" fill="#7dc4dd">지각 <tspan font-size="12" font-weight="400" fill="#85858f">Merkwelt</tspan></text>
    <text x="280" y="96" font-size="13" fill="#85858f">땀 냄새 · 체온 · 털의 촉감</text>
  </g>
  <path d="M134 220 C 160 286, 400 286, 426 222" fill="none" stroke="#9a8fe0" stroke-width="2.2" stroke-linecap="round" marker-end="url(#uw-p)"/>
  <g text-anchor="middle">
    <text x="280" y="236" font-size="13" fill="#85858f">떨어진다 · 기어 다닌다 · 피를 빤다</text>
    <text x="280" y="298" font-size="15" font-weight="700" fill="#9a8fe0">작용 <tspan font-size="12" font-weight="400" fill="#85858f">Wirkwelt</tspan></text>
  </g>
  <g text-anchor="middle">
    <text x="280" y="148" font-size="13" fill="#85858f">이 세 신호 밖의 세계는</text>
    <text x="280" y="167" font-size="13" fill="#85858f">진드기에게 존재하지 않는다</text>
    <text x="280" y="190" font-size="12" fill="#85858f" fill-opacity="0.8">빛도, 색도, 소리도 없다</text>
  </g>

  <!-- ── 아래: 같은 방, 다른 세계들 ── -->
  <rect x="10" y="326" width="540" height="284" rx="22" fill="none" stroke="#85858f" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="30" y="358" font-size="16" font-weight="700" fill="#2f8fef">같은 체육관, 생물의 수만큼 다른 방</text>
  <text x="30" y="378" font-size="12" fill="#85858f">모두 같은 자리에 있지만 같은 곳에 있지 않다 — 에드 용</text>
  <circle cx="98" cy="430" r="40" fill="#2f8fef" fill-opacity="0.12" stroke="#2f8fef" stroke-opacity="0.8" stroke-width="1.6"/>
  <g transform="translate(81.0 413.0) scale(1.417)" fill="none" stroke="#2f8fef" stroke-width="1.27" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6.5" r="3.2"/><path d="M5.5 21v-3a6.5 6.5 0 0 1 13 0v3"/></g>
  <text x="98" y="488" font-size="14" font-weight="700" fill="#2f8fef" text-anchor="middle">사람</text>
  <text x="98" y="505" font-size="12" fill="#85858f" text-anchor="middle">색과 가청 소리</text>
  <circle cx="190" cy="512" r="40" fill="#9a8fe0" fill-opacity="0.12" stroke="#9a8fe0" stroke-opacity="0.8" stroke-width="1.6"/>
  <g transform="translate(173.0 495.0) scale(1.417)" fill="none" stroke="#9a8fe0" stroke-width="1.27" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 11.5C4 8.5 7 8 9 10.3c.7-1.4 1.6-2.2 3-2.2s2.3.8 3 2.2C17 8 20 8.5 22.5 11.5c-2.6-.4-4.4.6-5.3 2.6-1.4-1-2.9-1.1-4 .6h-2.4c-1.1-1.7-2.6-1.6-4-.6-.9-2-2.7-3-5.3-2.6z"/><path d="M10.8 8.4l-.5-2"/><path d="M13.2 8.4l.5-2"/></g>
  <text x="190" y="570" font-size="14" font-weight="700" fill="#9a8fe0" text-anchor="middle">박쥐</text>
  <text x="190" y="587" font-size="12" fill="#85858f" text-anchor="middle">초음파로 천장을 잰다</text>
  <circle cx="282" cy="430" r="40" fill="#e0a35c" fill-opacity="0.12" stroke="#e0a35c" stroke-opacity="0.8" stroke-width="1.6"/>
  <g transform="translate(265.0 413.0) scale(1.417)" fill="none" stroke="#e0a35c" stroke-width="1.27" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 16c2.2-4.4 5.3-4.4 7.5 0s5.3 4.4 7.5 0"/><path d="M17.5 16c.7-1.6 1.9-2.6 3.3-2.6"/><path d="M20.8 13.4l1.6-.9"/><path d="M20.8 13.4l1.6.7"/></g>
  <text x="282" y="488" font-size="14" font-weight="700" fill="#e0a35c" text-anchor="middle">방울뱀</text>
  <text x="282" y="505" font-size="12" fill="#85858f" text-anchor="middle">몸의 열을 읽는다</text>
  <circle cx="374" cy="512" r="40" fill="#e07fa3" fill-opacity="0.12" stroke="#e07fa3" stroke-opacity="0.8" stroke-width="1.6"/>
  <g transform="translate(357.0 495.0) scale(1.417)" fill="none" stroke="#e07fa3" stroke-width="1.27" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="14.5" rx="4.6" ry="5.8"/><path d="M7.6 13h8.8"/><path d="M7.8 16.2h8.4"/><ellipse cx="8.3" cy="7.5" rx="3" ry="3.8"/><ellipse cx="15.7" cy="7.5" rx="3" ry="3.8"/></g>
  <text x="374" y="570" font-size="14" font-weight="700" fill="#e07fa3" text-anchor="middle">뒤영벌</text>
  <text x="374" y="587" font-size="12" fill="#85858f" text-anchor="middle">자외선 무늬를 본다</text>
  <circle cx="466" cy="430" r="40" fill="#7dc4dd" fill-opacity="0.12" stroke="#7dc4dd" stroke-opacity="0.8" stroke-width="1.6"/>
  <g transform="translate(449.0 413.0) scale(1.417)" fill="none" stroke="#7dc4dd" stroke-width="1.27" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="14" rx="5" ry="6.5"/><circle cx="12" cy="6" r="1.8"/><path d="M7.5 10.5 L3.5 8.5"/><path d="M7 13 L3 13"/><path d="M7.3 15.8 L3.5 17.8"/><path d="M8.5 18.6 L5.5 21.5"/><path d="M16.5 10.5 L20.5 8.5"/><path d="M17 13 L21 13"/><path d="M16.7 15.8 L20.5 17.8"/><path d="M15.5 18.6 L18.5 21.5"/></g>
  <text x="466" y="488" font-size="14" font-weight="700" fill="#7dc4dd" text-anchor="middle">진드기</text>
  <text x="466" y="505" font-size="12" fill="#85858f" text-anchor="middle">냄새 · 온기 · 촉감뿐</text>
</svg>
