  <title>마찰음: 매끄러운 정현파와 불규칙한 진동들의 다발</title>
  <desc>매끄러운 정현파는 하나의 주파수만 가져 하나의 음높이로 들린다. 마찰음은 불규칙한 진동들이 겹친 다발이어서 주파수 성분이 넓은 대역에 흩어져 있고, 그래서 음높이가 아니라 음색과 질감으로 지각된다. 아래 막대는 각 소리를 이루는 주파수 성분이다.</desc>

