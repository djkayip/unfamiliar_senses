<svg xmlns="http://www.w3.org/2000/svg" width="560" height="206" viewBox="0 0 560 206" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <title>위상차: 어긋남이 쌓인다</title>
  <desc>같은 박 패턴(스티브 라이히 〈Clapping Music〉의 기본 패턴)을 두 루프가 돌린다. 안쪽 원(보라)은 템포 120, 바깥 원(하늘)은 템포 123으로 같은 방향(시계 방향)으로 돈다. 한 바퀴(12박)마다 0.3박씩 어긋나므로, 시작에서 맞물려 있던 두 원의 같은 박이 1바퀴 뒤 0.3박, 2바퀴 뒤 0.6박, 3바퀴 뒤 0.9박만큼 벌어진다. 같은 박을 잇는 선이 점점 기울고, 주황 호가 그 어긋남의 크기를 나타낸다.</desc>
