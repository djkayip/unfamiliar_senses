<svg xmlns="http://www.w3.org/2000/svg" width="560" height="550" viewBox="0 0 560 550" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <title>피드백 루프: 출력이 입력으로 되돌아오는 순환</title>
  <desc>입력이 시스템을 거쳐 출력이 되고, 그 출력이 다시 입력으로 되돌아온다(예: 마이크와 스피커 사이의 하울링). 되돌아온 출력이 입력을 상쇄하면 음의 피드백으로 시스템이 균형을 찾고, 강화하면 양의 피드백으로 변화가 증폭되어 폭주한다.</desc>
  <defs>
    <marker id="fb-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2f8fef"/>
    </marker>
  </defs>

  <!-- ── 위: 순환 — 입력 → 시스템 → 출력 → 되먹임 ── -->
  <g fill="#2f8fef" fill-opacity="0.07" stroke="#2f8fef" stroke-opacity="0.7" stroke-width="1.5">
    <rect x="10" y="42" width="150" height="72" rx="12"/>
    <rect x="215" y="42" width="130" height="72" rx="12"/>
    <rect x="400" y="42" width="150" height="72" rx="12"/>
  </g>
  <g text-anchor="middle">
    <text x="96" y="74" font-size="18" font-weight="700" fill="#2f8fef">입력</text>
    <text x="85" y="98" font-size="13" fill="#85858f">마이크에 입력된 소리</text>
    <text x="280" y="74" font-size="18" font-weight="700" fill="#2f8fef">시스템</text>
    <text x="280" y="98" font-size="13" fill="#85858f">앰프로 증폭된 소리</text>
    <text x="486" y="74" font-size="18" font-weight="700" fill="#2f8fef">출력</text>
    <text x="475" y="98" font-size="13" fill="#85858f">스피커로 출력된 소리</text>
  </g>

  <!-- 마이크 (입력), 스피커 (출력) -->
  <g fill="none" stroke="#2f8fef" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="59" y="57.5" width="8" height="13" rx="4" fill="#2f8fef" fill-opacity="0.25"/>
    <path d="M56 66.5 a7 7 0 0 0 14 0"/>
    <path d="M63 73.5 L63 77.5"/>
    <path d="M59 77.5 L67 77.5"/>
    <path d="M443 63.5 L447 63.5 L453 58.5 L453 76.5 L447 71.5 L443 71.5 Z" fill="#2f8fef" fill-opacity="0.25"/>
    <path d="M457 63.5 a6 6 0 0 1 0 8"/>
    <path d="M460.5 60.0 a10.5 10.5 0 0 1 0 15"/>
  </g>
  <g fill="none" stroke="#2f8fef" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fb-arrow)">
    <path d="M164 78 L209 78"/>
    <path d="M349 78 L394 78"/>
    <path d="M475 120 C 475 246, 85 246, 85 126"/>
  </g>
  <g text-anchor="middle">
    <text x="280" y="150" font-size="18" font-weight="700" fill="#2f8fef">되먹임</text>
    <text x="280" y="172" font-size="13" fill="#85858f">출력이 공간을 거쳐</text>
    <text x="280" y="189" font-size="13" fill="#85858f">다시 입력으로 돌아온다</text>
    <text x="280" y="248" font-size="14" fill="#85858f">돌아온 출력이 입력을 어떻게 바꾸느냐에 따라</text>
  </g>

  <!-- ── 왼쪽 아래: 음(−)의 피드백 — 상쇄, 잦아든다 ── -->
  <rect x="10" y="262" width="264" height="276" rx="22" fill="#7dc4dd" fill-opacity="0.07" stroke="#7dc4dd" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="30" y="300" font-size="19" font-weight="700" fill="#7dc4dd">음(−)의 피드백</text>
  <text x="30" y="324" font-size="14" fill="#85858f">출력이 입력을 상쇄한다</text>
  <line x1="36" y1="388" x2="256" y2="388" stroke="#85858f" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="4 5"/>
  <path d="M36.0 388.0 L37.8 379.4 L39.7 371.6 L41.5 365.2 L43.3 360.4 L45.2 357.3 L47.0 356.0 L48.8 356.6 L50.7 358.8 L52.5 362.5 L54.3 367.4 L56.2 373.2 L58.0 379.5 L59.8 385.9 L61.7 392.1 L63.5 397.7 L65.3 402.6 L67.2 406.4 L69.0 409.0 L70.8 410.3 L72.7 410.3 L74.5 409.1 L76.3 406.8 L78.2 403.6 L80.0 399.8 L81.8 395.5 L83.7 391.0 L85.5 386.5 L87.3 382.4 L89.2 378.8 L91.0 375.9 L92.8 373.8 L94.7 372.6 L96.5 372.3 L98.3 372.8 L100.2 374.2 L102.0 376.2 L103.8 378.8 L105.7 381.7 L107.5 384.9 L109.3 388.0 L111.2 391.0 L113.0 393.6 L114.8 395.8 L116.7 397.5 L118.5 398.6 L120.3 399.0 L122.2 398.8 L124.0 398.0 L125.8 396.8 L127.7 395.1 L129.5 393.1 L131.3 390.9 L133.2 388.7 L135.0 386.6 L136.8 384.6 L138.7 383.0 L140.5 381.7 L142.3 380.8 L144.2 380.3 L146.0 380.3 L147.8 380.7 L149.7 381.5 L151.5 382.6 L153.3 383.9 L155.2 385.4 L157.0 387.0 L158.8 388.5 L160.7 389.9 L162.5 391.2 L164.3 392.2 L166.2 392.9 L168.0 393.3 L169.8 393.4 L171.7 393.2 L173.5 392.8 L175.3 392.1 L177.2 391.2 L179.0 390.2 L180.8 389.1 L182.7 388.0 L184.5 387.0 L186.3 386.1 L188.2 385.3 L190.0 384.7 L191.8 384.4 L193.7 384.2 L195.5 384.3 L197.3 384.5 L199.2 385.0 L201.0 385.6 L202.8 386.2 L204.7 387.0 L206.5 387.8 L208.3 388.5 L210.2 389.2 L212.0 389.7 L213.8 390.2 L215.7 390.5 L217.5 390.6 L219.3 390.6 L221.2 390.5 L223.0 390.2 L224.8 389.9 L226.7 389.4 L228.5 388.9 L230.3 388.4 L232.2 387.8 L234.0 387.3 L235.8 386.9 L237.7 386.6 L239.5 386.3 L241.3 386.2 L243.2 386.1 L245.0 386.2 L246.8 386.4 L248.7 386.6 L250.5 386.9 L252.3 387.3 L254.2 387.6 L256.0 388.0" fill="none" stroke="#7dc4dd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="30" y="466" font-size="15" font-weight="700" fill="#7dc4dd">→ 균형·안정 (자기조절)</text>
  <text x="30" y="492" font-size="13" fill="#85858f" fill-opacity="0.9">예: 체온·혈당의 항상성,</text>
  <text x="30" y="510" font-size="13" fill="#85858f" fill-opacity="0.9">온도조절기</text>

  <!-- ── 오른쪽 아래: 양(+)의 피드백 — 강화, 폭주한다 ── -->
  <rect x="286" y="262" width="264" height="276" rx="22" fill="#9a8fe0" fill-opacity="0.07" stroke="#9a8fe0" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="306" y="300" font-size="19" font-weight="700" fill="#9a8fe0">양(+)의 피드백</text>
  <text x="306" y="324" font-size="14" fill="#85858f">출력이 입력을 강화한다</text>
  <line x1="304" y1="388" x2="524" y2="388" stroke="#85858f" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="4 5"/>
  <path d="M304.0 388.0 L305.8 387.0 L307.7 386.1 L309.5 385.3 L311.3 384.5 L313.2 383.9 L315.0 383.6 L316.8 383.5 L318.7 383.6 L320.5 384.0 L322.3 384.6 L324.2 385.4 L326.0 386.5 L327.8 387.6 L329.7 388.8 L331.5 390.0 L333.3 391.2 L335.2 392.2 L337.0 393.0 L338.8 393.6 L340.7 393.8 L342.5 393.8 L344.3 393.4 L346.2 392.7 L348.0 391.7 L349.8 390.4 L351.7 389.0 L353.5 387.5 L355.3 385.9 L357.2 384.4 L359.0 383.0 L360.8 381.9 L362.7 381.1 L364.5 380.6 L366.3 380.5 L368.2 380.9 L370.0 381.6 L371.8 382.8 L373.7 384.3 L375.5 386.1 L377.3 388.0 L379.2 390.0 L381.0 392.0 L382.8 393.8 L384.7 395.4 L386.5 396.6 L388.3 397.4 L390.2 397.6 L392.0 397.4 L393.8 396.6 L395.7 395.2 L397.5 393.4 L399.3 391.3 L401.2 388.8 L403.0 386.3 L404.8 383.7 L406.7 381.3 L408.5 379.1 L410.3 377.4 L412.2 376.2 L414.0 375.7 L415.8 375.8 L417.7 376.6 L419.5 378.1 L421.3 380.2 L423.2 382.8 L425.0 385.8 L426.8 389.1 L428.7 392.4 L430.5 395.6 L432.3 398.5 L434.2 400.9 L436.0 402.7 L437.8 403.7 L439.7 403.8 L441.5 403.1 L443.3 401.5 L445.2 399.0 L447.0 395.8 L448.8 392.1 L450.7 388.0 L452.5 383.7 L454.3 379.5 L456.2 375.7 L458.0 372.4 L459.8 369.8 L461.7 368.2 L463.5 367.6 L465.3 368.2 L467.2 369.9 L469.0 372.7 L470.8 376.5 L472.7 381.1 L474.5 386.2 L476.3 391.6 L478.2 397.1 L480.0 402.2 L481.8 406.8 L483.7 410.4 L485.5 412.9 L487.3 414.1 L489.2 413.9 L491.0 412.2 L492.8 409.0 L494.7 404.5 L496.5 399.0 L498.3 392.6 L500.2 385.7 L502.0 378.6 L503.8 371.8 L505.7 365.7 L507.5 360.6 L509.3 356.9 L511.2 354.8 L513.0 354.5 L514.8 356.0 L516.7 359.5 L518.5 364.7 L520.3 371.4 L522.2 379.3 L524.0 388.0" fill="none" stroke="#9a8fe0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="306" y="466" font-size="15" font-weight="700" fill="#9a8fe0">→ 증폭·폭주 (자기증폭)</text>
  <text x="306" y="492" font-size="13" fill="#85858f" fill-opacity="0.9">예: 마이크 하울링,</text>
  <text x="306" y="510" font-size="13" fill="#85858f" fill-opacity="0.9">빙하 융해, 바이럴 확산</text>
</svg>
