<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <title>동물 의사소통: 적합도 행렬</title>
  <desc>발송자와 수령자의 적합도에 따라 의사소통이 갈린다. 발송자 +이고 수령자 +면 참 의사소통으로, 이때만 소통이 지속된다. 발송자 +·수령자 0은 조작, 발송자 +·수령자 −는 사기, 발송자 −·수령자 +는 도청·착취다. 조작·사기·도청·착취는 거짓 의사소통이며, 참 의사소통이 강하게 작동할 때에만 거기에 기생한다.</desc>

  <!-- 열 머리: 수령자 -->
  <text x="185" y="34" font-size="14" font-weight="700" fill="#85858f" text-anchor="middle">수령자 −</text>
  <text x="329" y="34" font-size="14" font-weight="700" fill="#85858f" text-anchor="middle">수령자 0</text>
  <text x="473" y="34" font-size="14" font-weight="700" fill="#85858f" text-anchor="middle">수령자 +</text>

  <!-- 행 머리: 발송자 -->
  <text x="20" y="114" font-size="14" font-weight="700" fill="#85858f">발송자 +</text>
  <text x="20" y="242" font-size="14" font-weight="700" fill="#85858f">발송자 −</text>

  <!-- 발송자 + 행 -->
  <rect x="118" y="50" width="134" height="116" rx="12" fill="#e0a35c" fill-opacity="0.08" stroke="#e0a35c" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="134" y="82" font-size="18" font-weight="700" fill="#e0a35c">사기</text>
  <text x="134" y="101" font-size="11" fill="#85858f">deceit</text>
  <text x="134" y="146" font-size="11.5" fill="#85858f">발송자 + · 수령자 −</text>

  <rect x="262" y="50" width="134" height="116" rx="12" fill="#e0a35c" fill-opacity="0.08" stroke="#e0a35c" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="278" y="82" font-size="18" font-weight="700" fill="#e0a35c">조작</text>
  <text x="278" y="101" font-size="11" fill="#85858f">manipulation</text>
  <text x="278" y="146" font-size="11.5" fill="#85858f">발송자 + · 수령자 0</text>

  <rect x="406" y="50" width="134" height="116" rx="12" fill="#9a8fe0" fill-opacity="0.22" stroke="#9a8fe0" stroke-width="2.2"/>
  <text x="422" y="82" font-size="18" font-weight="700" fill="#9a8fe0">참 의사소통</text>
  <text x="422" y="101" font-size="11" fill="#85858f">true communication</text>
  <text x="422" y="128" font-size="11.5" fill="#85858f">발송자 + · 수령자 +</text>
  <text x="422" y="150" font-size="12.5" font-weight="700" fill="#9a8fe0">이때만 지속된다</text>

  <!-- 발송자 − 행 -->
  <rect x="118" y="178" width="134" height="116" rx="12" fill="none" stroke="#85858f" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text x="185" y="242" font-size="16" fill="#85858f" fill-opacity="0.6" text-anchor="middle">—</text>
  <rect x="262" y="178" width="134" height="116" rx="12" fill="none" stroke="#85858f" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text x="329" y="242" font-size="16" fill="#85858f" fill-opacity="0.6" text-anchor="middle">—</text>

  <rect x="406" y="178" width="134" height="116" rx="12" fill="#e0a35c" fill-opacity="0.08" stroke="#e0a35c" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="422" y="210" font-size="18" font-weight="700" fill="#e0a35c">도청 · 착취</text>
  <text x="422" y="229" font-size="11" fill="#85858f">eavesdropping ·</text>
  <text x="422" y="243" font-size="11" fill="#85858f">exploitation</text>
  <text x="422" y="274" font-size="11.5" fill="#85858f">발송자 − · 수령자 +</text>

  <!-- 범례 -->
  <rect x="20" y="322" width="14" height="14" rx="3" fill="#9a8fe0" fill-opacity="0.22" stroke="#9a8fe0" stroke-width="1.6"/>
  <text x="44" y="334" font-size="13" fill="#85858f"><tspan font-weight="700" fill="#9a8fe0">참 의사소통</tspan>  둘 다 이익을 볼 때만 소통이 지속된다</text>
  <rect x="20" y="350" width="14" height="14" rx="3" fill="#e0a35c" fill-opacity="0.08" stroke="#e0a35c" stroke-width="1.6"/>
  <text x="44" y="362" font-size="13" fill="#85858f"><tspan font-weight="700" fill="#e0a35c">거짓 의사소통</tspan>  조작 · 사기 · 도청 · 착취, 한쪽이 손해를 보는 소통</text>

  <line x1="20" y1="388" x2="540" y2="388" stroke="#85858f" stroke-opacity="0.3" stroke-width="1"/>
  <text x="20" y="416" font-size="13.5" font-weight="700" fill="#85858f">거짓은 참 의사소통이 강하게 작동할 때에만 거기에 기생할 수 있다.</text>
</svg>
