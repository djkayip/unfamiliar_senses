<svg xmlns="http://www.w3.org/2000/svg" width="560" height="214" viewBox="0 0 560 214" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <title>어쿠스메트르: 보이지 않는 목소리의 권력과 탈-어쿠스마틱화</title>
  <desc>몸이 화면에 보이지 않는 목소리는 화면 테두리를 넘어 어디로든 퍼지며 편재성·전시성·전지성·전능성이라는 권력을 갖는다. 그 몸이 화면에 드러나는 순간(탈-어쿠스마틱화) 목소리는 인간의 척도로 끌어내려지고 권력을 잃는다. 막대는 두 상태의 권력을 견준 것이다.</desc>
  <defs>
    <radialGradient id="am-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#9a8fe0" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#9a8fe0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#9a8fe0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 보이지 않는 목소리: 화면을 넘어 퍼지는 음파 -->
    <g stroke="#9a8fe0">
      <circle cx="110" cy="87" r="34" stroke-width="1.6" stroke-opacity="0.55"/>
      <circle cx="110" cy="87" r="58" stroke-width="1.4" stroke-opacity="0.35"/>
      <circle cx="110" cy="87" r="82" stroke-width="1.2" stroke-opacity="0.2"/>
      <circle cx="110" cy="87" r="106" stroke-width="1" stroke-opacity="0.1"/>
    </g>
    <rect x="20" y="32" width="180" height="110" rx="12" fill="url(#am-glow)"/>
    <rect x="20.75" y="32.75" width="178.5" height="108.5" rx="12" stroke="#9a8fe0" stroke-opacity="0.8" stroke-width="1.5"/>
    <g stroke="#9a8fe0" stroke-width="1.4" stroke-dasharray="3 3" stroke-opacity="0.8">
      <circle cx="110" cy="74" r="9"/>
      <path d="M94 118 C94 100 100 90 110 90 C120 90 126 100 126 118"/>
    </g>

    <!-- 드러난 몸 -->
    <rect x="348.75" y="32.75" width="178.5" height="108.5" rx="12" fill="#9a8fe0" fill-opacity="0.05" stroke="#9a8fe0" stroke-opacity="0.8" stroke-width="1.5"/>
    <g stroke="#9a8fe0" stroke-width="1.8">
      <circle cx="438" cy="74" r="9" fill="#9a8fe0" fill-opacity="0.35"/>
      <path d="M422 118 C422 100 428 90 438 90 C448 90 454 100 454 118 Z" fill="#9a8fe0" fill-opacity="0.35"/>
    </g>
    <path d="M452 70 A7 7 0 0 1 452 80" stroke="#9a8fe0" stroke-width="1.4" stroke-opacity="0.7"/>

    <!-- 권력 막대 -->
    <path d="M211 142 L211 32" stroke="#9a8fe0" stroke-width="6"/>
    <path d="M539 142 L539 120" stroke="#9a8fe0" stroke-width="6"/>
    <path d="M539 118 L539 32" stroke="#85858f" stroke-opacity="0.22" stroke-width="6"/>

    <!-- 탈-어쿠스마틱화 -->
    <path d="M226 87 L332 87 M326 82 L332 87 L326 92" stroke="#e0a35c" stroke-width="2.2"/>

    <!-- 네 가지 권력 -->
    <g stroke="#9a8fe0" stroke-width="1.5">
      <g fill="#9a8fe0" stroke="none">
        <circle cx="34" cy="171" r="2"/><circle cx="44" cy="165" r="2"/><circle cx="50" cy="175" r="2"/><circle cx="40" cy="178" r="2"/>
        <circle cx="87" cy="171" r="2.4"/>
      </g>
      <path d="M77 171 C81 165 93 165 97 171 C93 177 81 177 77 171 Z"/>
      <path d="M124 164 L124 179 C127 177 131 177 133 179 L133 164 C131 162 127 162 124 164 Z M133 164 C135 162 139 162 142 164 L142 179 C139 177 135 177 133 179"/>
      <path d="M180 162 L173 172 L179 172 L175 181 L184 169 L178 169 Z" fill="#9a8fe0" fill-opacity="0.25"/>
    </g>
  </g>

  <g text-anchor="middle">
    <text x="110" y="21" font-size="14" font-weight="700" fill="#9a8fe0">보이지 않는 목소리</text>
    <text x="438" y="21" font-size="14" font-weight="700" fill="#85858f">드러난 몸</text>
    <text x="280" y="77" font-size="12" font-weight="700" fill="#e0a35c">탈-어쿠스마틱화</text>
    <text x="211" y="157" font-size="11" fill="#9a8fe0">권력</text>
    <text x="539" y="157" font-size="11" fill="#9a8fe0">권력</text>
    <text x="438" y="170" font-size="13" fill="#85858f">인간의 척도로</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#85858f">
    <text x="42" y="199">편재성</text>
    <text x="87" y="199">전시성</text>
    <text x="133" y="199">전지성</text>
    <text x="178" y="199">전능성</text>
  </g>
</svg>
