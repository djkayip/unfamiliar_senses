<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <title>폴리포니와 호모포니: 가로로 흐르는 성부들과 수직으로 묶인 화음</title>
  <desc>폴리포니에서는 여러 성부가 같은 굵기로 각자 가로로 흐르며, 서로 다른 때에 들어오고 나간다. 호모포니에서는 박자마다 음들이 수직으로 묶여 함께 움직이고, 맨 위의 주성부 하나가 선율을 이끌며 나머지는 그 아래에 종속된다. 이미 폴리포니로 섞여 있는 소리를 우리는 호모포니로 소거해 듣는다.</desc>
  <defs>
    <marker id="ph-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e0a35c"/>
    </marker>
  </defs>

  <g fill="#9a8fe0" fill-opacity="0.05" stroke="#9a8fe0" stroke-opacity="0.4" stroke-width="1.5">
    <rect x="16.75" y="34.75" width="238.5" height="118.5" rx="12"/>
    <rect x="304.75" y="34.75" width="238.5" height="118.5" rx="12"/>
  </g>

