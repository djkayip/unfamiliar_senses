<svg xmlns="http://www.w3.org/2000/svg" width="560" height="334" viewBox="0 0 560 334" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <title>사건 분절 이론: 예측 오류가 사건의 경계를 만든다</title>
  <desc>예측이 맞는 동안 뇌는 이벤트 모델을 유지하고 예측 오류는 낮게 머문다. 오류가 임계치를 넘는 찰나가 사건의 경계이며, 그때 주의가 최고조에 이르고 새 모델이 세워져 흐름이 사건 A·B·C·D로 나뉜다. 사건은 수 분 단위의 거시 분절과 수 초 단위의 미세 분절로 겹겹이 나뉘고, 거시 경계에는 대개 미세 경계가 함께 일어난다.</desc>

  <!-- 사건 띠 -->
  <g fill="#9a8fe0">
    <rect x="32" y="200" width="128" height="36" fill-opacity="0.07"/>
    <rect x="160" y="200" width="148" height="36" fill-opacity="0.16"/>
    <rect x="308" y="200" width="134" height="36" fill-opacity="0.07"/>
    <rect x="442" y="200" width="86" height="36" fill-opacity="0.16"/>
  </g>

  <!-- 주의의 최고조 -->
  <g fill="#e0a35c" fill-opacity="0.22">
    <circle cx="160" cy="48" r="16"/>
    <circle cx="308" cy="48" r="16"/>
    <circle cx="442" cy="48" r="16"/>
  </g>

  <!-- 예측 오류 -->
  <path transform="translate(32 34)" d="M0 122 L20 118 L40 124 L60 119 L80 123 L100 120 L112 121 L120 60 L128 14 L136 70 L146 118 L170 122 L190 117 L210 123 L230 119 L250 122 L262 120 L270 50 L276 14 L284 66 L294 119 L320 122 L340 118 L360 123 L380 120 L398 121 L404 64 L410 14 L418 72 L428 119 L450 122 L470 118 L496 121" fill="none" stroke="#7dc4dd" stroke-width="2" stroke-linejoin="round"/>
  <!-- 임계치 -->
  <path d="M32 90 L528 90" fill="none" stroke="#e0a35c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- 경계 -->
  <path d="M160 48 L160 236 M308 48 L308 236 M442 48 L442 236" fill="none" stroke="#9a8fe0" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- 거시·미세 분절 -->
  <g transform="translate(130 268)" fill="none" stroke-linecap="round">
    <path d="M0 10 L398 10" stroke="#85858f" stroke-opacity="0.5" stroke-width="1.2"/>
    <path d="M30 1 L30 19 M178 1 L178 19 M312 1 L312 19" stroke="#9a8fe0" stroke-width="2.5"/>
  </g>
  <g transform="translate(130 300)" fill="none" stroke-linecap="round">
    <path d="M0 10 L398 10" stroke="#85858f" stroke-opacity="0.5" stroke-width="1.2"/>
    <path d="M8 5 L8 15 M47 5 L47 15 M66 5 L66 15 M88 5 L88 15 M104 5 L104 15 M126 5 L126 15 M146 5 L146 15 M196 5 L196 15 M214 5 L214 15 M236 5 L236 15 M252 5 L252 15 M270 5 L270 15 M290 5 L290 15 M330 5 L330 15 M350 5 L350 15 M366 5 L366 15 M384 5 L384 15" stroke="#7dc4dd" stroke-width="1.8"/>
    <path d="M30 3 L30 17 M178 3 L178 17 M312 3 L312 17" stroke="#9a8fe0" stroke-width="2.2"/>
  </g>
  <path d="M160 288 L160 300 M308 288 L308 300 M442 288 L442 300" fill="none" stroke="#9a8fe0" stroke-width="1.2" stroke-dasharray="2 2"/>

  <text x="32" y="25" font-size="14" font-weight="700" fill="#7dc4dd">예측 오류</text>
  <g font-size="13" font-weight="700" fill="#9a8fe0" text-anchor="middle">
    <text x="160" y="22">경계</text>
    <text x="308" y="22">경계</text>
    <text x="442" y="22">경계</text>
  </g>
  <text x="528" y="80" font-size="13" fill="#e0a35c" text-anchor="end">임계치</text>
  <text x="236" y="124" font-size="13" font-weight="700" fill="#7dc4dd" text-anchor="middle">모델 유지</text>
  <g font-size="14" font-weight="700" fill="#9a8fe0" text-anchor="middle">
    <text x="96" y="223">사건 A</text>
    <text x="234" y="223">사건 B</text>
    <text x="375" y="223">사건 C</text>
    <text x="485" y="223">사건 D</text>
  </g>
  <text x="528" y="251" font-size="12" fill="#85858f" text-anchor="end">시간 →</text>
  <g font-size="13" font-weight="700">
    <text x="10" y="282" fill="#9a8fe0">거시 분절 · 수 분</text>
    <text x="10" y="314" fill="#7dc4dd">미세 분절 · 수 초</text>
  </g>
</svg>
