<svg xmlns="http://www.w3.org/2000/svg" width="560" height="616" viewBox="0 0 560 616" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <title>신유물론의 계보</title>
  <desc>왼쪽: 데모크리토스·에피쿠로스·스피노자·디드로·들뢰즈로 이어지는 계보가 제인 베넷의 생동하는 물질에 이른다. 헤겔·마르크스·아도르노의 역사적 유물론은 이 계보 바깥에 있으며, 베넷은 아도르노의 비동일성만 끌어온다. 가운데: 닐스 보어의 양자물리학이 캐런 바라드의 내부작용으로 이어진다. 오른쪽: 브뤼노 라투르의 행위자-네트워크 이론이 신유물론과 맞물리고, 메이야수의 사변적 실재론은 다른 흐름이지만 같은 방향을 향한다. 아래: 신유물론의 음향 갈래인 소리의 물질성(크리스토프 콕스)과 그에 대한 이언 캠벨의 비판.</desc>
  <defs>
    <marker id="nm-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9a8fe0"/></marker>
    <marker id="nm-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7dc4dd"/></marker>
    <marker id="nm-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#e0a35c"/></marker>
    <marker id="nm-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f8fef"/></marker>
    <marker id="nm-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#85858f"/></marker>
  </defs>

  <!-- ── 왼쪽: 생기적 유물론의 계보 ── -->
  <rect x="15" y="14" width="160" height="196" rx="10" fill="#9a8fe0" fill-opacity="0.08" stroke="#9a8fe0" stroke-opacity="0.6" stroke-width="1.4"/>
  <g font-size="15" font-weight="600" fill="#9a8fe0" text-anchor="middle">
    <text x="95" y="42">데모크리토스</text>
    <text x="95" y="80">에피쿠로스</text>
    <text x="95" y="118">스피노자</text>
    <text x="95" y="156">디드로</text>
    <text x="95" y="194">들뢰즈</text>
  </g>
  <g stroke="#9a8fe0" stroke-width="1.4" marker-end="url(#nm-p)">
    <line x1="95" y1="49" x2="95" y2="63"/>
    <line x1="95" y1="87" x2="95" y2="101"/>
    <line x1="95" y1="125" x2="95" y2="139"/>
    <line x1="95" y1="163" x2="95" y2="177"/>
  </g>
  <line x1="95" y1="210" x2="95" y2="228" stroke="#9a8fe0" stroke-width="1.6" marker-end="url(#nm-p)"/>
  <rect x="15" y="232" width="160" height="58" rx="10" fill="#9a8fe0" fill-opacity="0.18" stroke="#9a8fe0" stroke-width="1.6"/>
  <text x="95" y="257" font-size="16" font-weight="700" fill="#9a8fe0" text-anchor="middle">제인 베넷</text>
  <text x="95" y="278" font-size="13" fill="#85858f" text-anchor="middle">생동하는 물질</text>

  <!-- ── 역사적 유물론: 계보 바깥 ── -->
  <rect x="205" y="14" width="340" height="62" rx="10" fill="#85858f" fill-opacity="0.08" stroke="#85858f" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="375" y="40" font-size="15" font-weight="600" fill="#85858f" text-anchor="middle">헤겔 · 마르크스 · 아도르노</text>
  <text x="375" y="62" font-size="13" fill="#85858f" text-anchor="middle">역사적 유물론</text>
  <path d="M205 45 H190 V280 H181" fill="none" stroke="#85858f" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#nm-g)"/>
  <text x="190" y="306" font-size="13" fill="#85858f" text-anchor="middle">비동일성</text>

  <!-- ── 가운데: 물리학에서 ── -->
  <rect x="205" y="122" width="150" height="58" rx="10" fill="#7dc4dd" fill-opacity="0.1" stroke="#7dc4dd" stroke-opacity="0.8" stroke-width="1.4"/>
  <text x="280" y="147" font-size="15" font-weight="600" fill="#7dc4dd" text-anchor="middle">닐스 보어</text>
  <text x="280" y="168" font-size="13" fill="#85858f" text-anchor="middle">양자물리학</text>
  <line x1="280" y1="180" x2="280" y2="228" stroke="#7dc4dd" stroke-width="1.6" marker-end="url(#nm-s)"/>
  <rect x="205" y="232" width="150" height="58" rx="10" fill="#7dc4dd" fill-opacity="0.18" stroke="#7dc4dd" stroke-width="1.6"/>
  <text x="280" y="257" font-size="16" font-weight="700" fill="#7dc4dd" text-anchor="middle">캐런 바라드</text>
  <text x="280" y="278" font-size="13" fill="#85858f" text-anchor="middle">내부작용</text>

  <!-- ── 오른쪽: ANT, 사변적 실재론 ── -->
  <rect x="385" y="122" width="160" height="58" rx="10" fill="#e0a35c" fill-opacity="0.18" stroke="#e0a35c" stroke-width="1.6"/>
  <text x="465" y="147" font-size="16" font-weight="700" fill="#e0a35c" text-anchor="middle">브뤼노 라투르</text>
  <text x="465" y="168" font-size="13" fill="#85858f" text-anchor="middle">행위자-네트워크 이론</text>
  <line x1="400" y1="180" x2="400" y2="338" stroke="#e0a35c" stroke-width="1.6" marker-end="url(#nm-o)"/>
  <rect x="420" y="232" width="125" height="58" rx="10" fill="#e0a35c" fill-opacity="0.06" stroke="#e0a35c" stroke-opacity="0.8" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="482" y="257" font-size="15" font-weight="600" fill="#e0a35c" text-anchor="middle">메이야수</text>
  <text x="482" y="278" font-size="13" fill="#85858f" text-anchor="middle">사변적 실재론</text>
  <line x1="482" y1="290" x2="482" y2="338" stroke="#e0a35c" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#nm-o)"/>

  <!-- 모이는 화살표 -->
  <line x1="95" y1="290" x2="95" y2="338" stroke="#9a8fe0" stroke-width="1.6" marker-end="url(#nm-p)"/>
  <line x1="280" y1="290" x2="280" y2="338" stroke="#7dc4dd" stroke-width="1.6" marker-end="url(#nm-s)"/>

  <!-- ── 신유물론 ── -->
  <rect x="15" y="342" width="530" height="52" rx="12" fill="#2f8fef" fill-opacity="0.14" stroke="#2f8fef" stroke-width="1.8"/>
  <text x="280" y="375" font-size="19" font-weight="700" fill="#2f8fef" text-anchor="middle">신유물론</text>

  <!-- 갈래 -->
  <line x1="95" y1="394" x2="95" y2="436" stroke="#2f8fef" stroke-width="1.6" marker-end="url(#nm-b)"/>

  <rect x="15" y="440" width="160" height="58" rx="10" fill="#e07fa3" fill-opacity="0.16" stroke="#e07fa3" stroke-width="1.6"/>
  <text x="95" y="465" font-size="16" font-weight="700" fill="#e07fa3" text-anchor="middle">소리의 물질성</text>
  <text x="95" y="486" font-size="13" fill="#85858f" text-anchor="middle">크리스토프 콕스</text>


  <!-- 비판 -->
  <rect x="35" y="560" width="120" height="44" rx="10" fill="none" stroke="#85858f" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="95" y="587" font-size="15" font-weight="600" fill="#85858f" text-anchor="middle">이언 캠벨</text>
  <line x1="95" y1="558" x2="95" y2="502" stroke="#85858f" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#nm-g)"/>
  <text x="105" y="535" font-size="13" fill="#85858f" text-anchor="start">비판</text>
</svg>
