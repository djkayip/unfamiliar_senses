    <linearGradient id="br-body" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#85858f" stop-opacity="0.16"/><stop offset="1" stop-color="#85858f" stop-opacity="0.07"/></linearGradient>
    <linearGradient id="br-cb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#85858f" stop-opacity="0.2"/><stop offset="1" stop-color="#85858f" stop-opacity="0.08"/></linearGradient>
