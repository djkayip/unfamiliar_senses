  <circle cx="207" cy="232" r="11" fill="#7dc4dd"/><text x="207" y="236.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="226" y="238" font-size="17" font-weight="700" fill="#7dc4dd">청각 피질<tspan font-size="12" font-weight="400" fill="#85858f">  측두엽</tspan></text>
  <text x="196" y="268" font-size="13" fill="#85858f">멜로디와 리듬을 알아보고,</text>
  <text x="196" y="288" font-size="13" fill="#85858f">음악의 기억을 저장한다.</text>

