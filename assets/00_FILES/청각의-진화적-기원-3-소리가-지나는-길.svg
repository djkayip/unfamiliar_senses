  <circle cx="207" cy="84" r="11" fill="#e0a35c"/><text x="207" y="88.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="226" y="90" font-size="17" font-weight="700" fill="#e0a35c">뇌간</text>
  <text x="196" y="120" font-size="13" fill="#85858f">귀로 들어온 소리가 가장 먼저 닿는다.</text>
  <text x="196" y="140" font-size="13" fill="#85858f">의미를 알기도 전에 몸이 먼저 움찔한다.</text>

  <rect x="10" y="194" width="460" height="124" rx="18" fill="#7dc4dd" fill-opacity="0.07" stroke="#7dc4dd" stroke-opacity="0.75" stroke-width="1.5"/>
