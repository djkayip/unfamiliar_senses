<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <title>청각의 진화적 기원: 소리가 지나는 길</title>
  <desc>뇌를 옆에서 본 그림으로 단계마다 해당 부위를 칠했다. 귀로 들어온 소리는 진화의 순서대로 ① 뇌간(몸이 먼저 반응한다), ② 측두엽의 청각 피질(멜로디·리듬을 알아본다), ③ 전두엽(가장 늦게 진화, 의미·맥락을 해석한다)을 지나고, 그 세 단계 내내 안쪽 깊은 곳의 변연계가 감정과 보상을 함께 처리한다.</desc>
  <defs>
    <clipPath id="br-clip"><path d="M28 118 C 8 92 14 52 52 30 C 92 6 160 0 210 14 C 254 27 286 60 288 100 C 290 124 280 140 262 146 C 246 151 236 150 226 156 C 206 170 170 174 140 168 C 118 175 92 172 76 158 C 66 150 60 138 50 134 C 40 131 32 126 28 118 Z"/></clipPath>
