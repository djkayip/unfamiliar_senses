  <text x="226" y="386" font-size="17" font-weight="700" fill="#2f8fef">전두엽<tspan font-size="12" font-weight="400" fill="#85858f">  가장 늦게 진화</tspan></text>
  <text x="196" y="416" font-size="13" fill="#85858f">소리의 의미와 맥락,</text>
  <text x="196" y="436" font-size="13" fill="#85858f">문화를 해석한다.</text>

