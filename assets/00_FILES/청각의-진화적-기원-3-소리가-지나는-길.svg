  <text x="20" y="28" font-size="15" font-weight="700" fill="#2f8fef">소리가 지나는 길</text>
  <text x="152" y="28" font-size="12" fill="#85858f">뇌 안에서도 진화의 순서대로 · 왼쪽이 앞(이마)</text>
