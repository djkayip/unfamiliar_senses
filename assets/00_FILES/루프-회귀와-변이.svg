  <title>루프와 피드백 루프: 회귀와 변이</title>
  <desc>왼쪽: 루프는 같은 점으로 되돌아오는 닫힌 순환이다. 아래 네 칸의 파형이 모두 같다(회귀). 오른쪽: 피드백 루프는 출력이 입력으로 되돌아가며 매번 달라지는 열린 순환이다. 나선처럼 벌어지고, 아래 네 칸에서는 앞의 소리 위에 새 소리가 겹쳐 쌓이며 파형이 바뀐다(변이).</desc>
