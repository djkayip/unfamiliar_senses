    <text x="465.0" y="376" font-size="13" fill="#85858f">그 공동체만의,</text>
    <text x="465.0" y="394" font-size="13" fill="#85858f">지켜야 할 소리</text>
    <text x="465.0" y="430" font-size="12" fill="#85858f" fill-opacity="0.85">예: 한 마을의 종소리,</text>
    <text x="465.0" y="448" font-size="12" fill="#85858f" fill-opacity="0.85">그 항구의 뱃고동</text>
  </g>

  <!-- ── 아래: 층위를 정하는 것은 주의 ── -->
  <rect x="10" y="492" width="540" height="84" rx="16" fill="none" stroke="#85858f" stroke-opacity="0.45" stroke-width="1.2"/>
  <g transform="translate(34 516) scale(1.500)" fill="none" stroke="#2f8fef" stroke-width="1.20" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10a7 7 0 1 1 13 3.6a10 10 0 0 1-2 2a8 8 0 0 0-2 3a4.5 4.5 0 0 1-6.8 1.4"/><path d="M10 10a3 3 0 1 1 5 2.2"/></g>
  <text x="92" y="528" font-size="15" font-weight="700" fill="#2f8fef">세 층위는 소리 자체가 아니라 듣는 이의 주의가 정한다</text>
  <text x="92" y="552" font-size="13" fill="#85858f">어떤 소리든 귀 기울이는 순간 전경, 곧 신호음이 될 수 있다</text>
</svg>
