<svg xmlns="http://www.w3.org/2000/svg" width="560" height="590" viewBox="0 0 560 590" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <title>사운드스케이프의 세 층위: 기조음·신호음·표식음</title>
  <desc>머레이 셰이퍼의 구분. 기조음은 바람·물·교통음처럼 흘려듣지만 지나칠 수 없는 배경의 소리, 신호음은 종·사이렌·경적처럼 의식해서 듣는 전경의 소리, 표식음은 한 공동체만의 소리로 그 장소를 그 장소이게 한다. 세 층위는 소리 자체가 아니라 듣는 이의 주의가 정하며, 어떤 소리든 귀 기울이면 전경이 될 수 있다.</desc>

  <!-- ── 위: 소리의 풍경 — 배경 위로 솟는 전경 ── -->
