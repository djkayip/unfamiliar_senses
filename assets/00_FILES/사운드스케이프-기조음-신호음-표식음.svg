  <path d="M236 186 L250 122 L264 186" fill="#2f8fef" fill-opacity="0.18" stroke="#2f8fef" stroke-width="2" stroke-linejoin="round"/>
  <g transform="translate(158 66) scale(1.000)" fill="none" stroke="#2f8fef" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></g>
  <g transform="translate(238 92) scale(1.000)" fill="none" stroke="#2f8fef" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18v-6a6 6 0 0 1 12 0v6"/><path d="M4 18h16v3H4z"/><path d="M12 2v2"/><path d="M4.2 4.8l1.4 1.4"/><path d="M19.8 4.8l-1.4 1.4"/><path d="M10 12a2 2 0 0 1 2-2"/></g>
  <text x="210" y="56" font-size="13" font-weight="700" fill="#2f8fef" text-anchor="middle">신호음</text>

  <!-- 표식음: 그 장소의 랜드마크처럼 -->
  <g fill="#9a8fe0" fill-opacity="0.18" stroke="#9a8fe0" stroke-width="2" stroke-linejoin="round">
    <path d="M468 186 L468 112 L480 92 L492 112 L492 186 Z"/>
  </g>
  <path d="M476 128 a4 4 0 0 1 8 0 v6 h-8 z" fill="none" stroke="#9a8fe0" stroke-width="1.6"/>
  <g fill="none" stroke="#9a8fe0" stroke-width="1.8" stroke-linecap="round">
    <path d="M500 96 a14 14 0 0 1 0 22" stroke-opacity="0.8"/>
    <path d="M508 88 a24 24 0 0 1 0 38" stroke-opacity="0.5"/>
    <path d="M460 96 a14 14 0 0 0 0 22" stroke-opacity="0.8"/>
    <path d="M452 88 a24 24 0 0 0 0 38" stroke-opacity="0.5"/>
  </g>
  <text x="480" y="74" font-size="13" font-weight="700" fill="#9a8fe0" text-anchor="middle">표식음</text>

  <!-- ── 가운데: 세 층위 ── -->
  <rect x="10" y="252" width="170" height="222" rx="20" fill="#7dc4dd" fill-opacity="0.07" stroke="#7dc4dd" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="7 6"/>
  <g transform="translate(49.0 272) scale(1.000)" fill="none" stroke="#7dc4dd" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M9.59 4.59A2 2 0 1 1 11 8H2"/><path d="M12.59 19.41A2 2 0 1 0 14 16H2"/><path d="M17.73 7.73A2.5 2.5 0 1 1 19.5 12H2"/></g><g transform="translate(83.0 272) scale(1.000)" fill="none" stroke="#7dc4dd" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0"/><path d="M2 13c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0"/><path d="M2 18c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0"/></g><g transform="translate(117.0 272) scale(1.000)" fill="none" stroke="#7dc4dd" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16v-4l2-5h14l2 5v4z"/><path d="M5 12h14"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/></g>
  <g text-anchor="middle">
    <text x="95.0" y="330" font-size="19" font-weight="700" fill="#7dc4dd">기조음</text>
    <text x="95.0" y="348" font-size="12" fill="#7dc4dd" fill-opacity="0.85">keynote sound</text>
    <text x="95.0" y="376" font-size="13" fill="#85858f">흘려듣지만</text>
    <text x="95.0" y="394" font-size="13" fill="#85858f">지나칠 수 없는 배경</text>
    <text x="95.0" y="430" font-size="12" fill="#85858f" fill-opacity="0.85">예: 바람·물·새·벌레,</text>
    <text x="95.0" y="448" font-size="12" fill="#85858f" fill-opacity="0.85">도시의 교통음</text>
  </g>
  <rect x="195" y="252" width="170" height="222" rx="20" fill="#2f8fef" fill-opacity="0.07" stroke="#2f8fef" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="7 6"/>
  <g transform="translate(234.0 272) scale(1.000)" fill="none" stroke="#2f8fef" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></g><g transform="translate(268.0 272) scale(1.000)" fill="none" stroke="#2f8fef" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18v-6a6 6 0 0 1 12 0v6"/><path d="M4 18h16v3H4z"/><path d="M12 2v2"/><path d="M4.2 4.8l1.4 1.4"/><path d="M19.8 4.8l-1.4 1.4"/><path d="M10 12a2 2 0 0 1 2-2"/></g><g transform="translate(302.0 272) scale(1.000)" fill="none" stroke="#2f8fef" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4h3l7 4V6L6 10H3z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19.5 5.5a9 9 0 0 1 0 13"/></g>
  <g text-anchor="middle">
    <text x="280.0" y="330" font-size="19" font-weight="700" fill="#2f8fef">신호음</text>
    <text x="280.0" y="348" font-size="12" fill="#2f8fef" fill-opacity="0.85">signal</text>
    <text x="280.0" y="376" font-size="13" fill="#85858f">의식해서 듣는</text>
    <text x="280.0" y="394" font-size="13" fill="#85858f">전경의 소리</text>
    <text x="280.0" y="430" font-size="12" fill="#85858f" fill-opacity="0.85">예: 종·호루라기,</text>
    <text x="280.0" y="448" font-size="12" fill="#85858f" fill-opacity="0.85">경적·사이렌</text>
  </g>
  <rect x="380" y="252" width="170" height="222" rx="20" fill="#9a8fe0" fill-opacity="0.07" stroke="#9a8fe0" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="7 6"/>
  <g transform="translate(436.0 272) scale(1.000)" fill="none" stroke="#9a8fe0" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></g><g transform="translate(470.0 272) scale(1.000)" fill="none" stroke="#9a8fe0" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M8 22V9l4-6 4 6v13"/><path d="M6 22h12"/><path d="M10.5 14.5a1.5 1.5 0 0 1 3 0v2h-3z"/><path d="M12 3V1"/></g>
