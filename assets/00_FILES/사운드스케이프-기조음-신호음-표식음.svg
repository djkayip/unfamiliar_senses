    <text x="12" y="70">전경</text>
    <text x="12" y="86" font-size="11" fill-opacity="0.8">figure</text>
    <text x="12" y="202">배경</text>
    <text x="12" y="218" font-size="11" fill-opacity="0.8">ground</text>
  </g>
  <path d="M58 64 L58 214" stroke="#85858f" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="3 4"/>

