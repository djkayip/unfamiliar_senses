<svg xmlns="http://www.w3.org/2000/svg" width="560" height="604" viewBox="0 0 560 604" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <title>청점: 어디로부터 소리를 듣는가</title>
  <desc>위: 시점은 한 점에서 정해진 방향으로 뻗지만, 청점은 소리가 또렷이 국지화되지 않아 한 점이 아니라 듣기 지대다. 가운데: 청점의 두 층위. 공간적 청점은 어디에서 듣는가(가까이서는 또렷하게, 벽 너머에서는 먹먹하게), 주관적 청점은 누구의 자리에서 듣는가(관객이 인물의 귀를 빌린다). 아래: 청점을 빚는 방법들 — 편집, 마이크의 지향성, 헤드폰 바이노럴, 걷는 몸.</desc>
  <defs>
    <radialGradient id="pa-zone"><stop offset="0" stop-color="#7dc4dd" stop-opacity="0.45"/><stop offset="0.55" stop-color="#7dc4dd" stop-opacity="0.16"/><stop offset="1" stop-color="#7dc4dd" stop-opacity="0"/></radialGradient>
    <linearGradient id="pa-cone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a8fe0" stop-opacity="0.35"/><stop offset="1" stop-color="#9a8fe0" stop-opacity="0.08"/></linearGradient>
    <marker id="pa-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#e0a35c"/></marker>
  </defs>

  <!-- ── 위: 시점 vs 청점 ── -->
  <rect x="10" y="10" width="264" height="196" rx="20" fill="#9a8fe0" fill-opacity="0.06" stroke="#9a8fe0" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="28" y="38" font-size="17" font-weight="700" fill="#9a8fe0">시점 <tspan font-size="12" font-weight="400" fill="#85858f">Point of View</tspan></text>
  <path d="M74 120 L246 74 L246 166 Z" fill="url(#pa-cone)" stroke="#9a8fe0" stroke-opacity="0.7" stroke-width="1.3"/>
  <g transform="translate(42.0 104.0) scale(1.333)" fill="none" stroke="#9a8fe0" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h3l2-3h8l2 3h3v11H3z"/><circle cx="12" cy="13" r="4"/></g>
  <circle cx="214" cy="120" r="5" fill="#9a8fe0"/>
  <text x="28" y="190" font-size="12.5" fill="#85858f">한 점에서, 정해진 방향으로 또렷하게</text>

  <rect x="286" y="10" width="264" height="196" rx="20" fill="#7dc4dd" fill-opacity="0.06" stroke="#7dc4dd" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="304" y="38" font-size="17" font-weight="700" fill="#7dc4dd">청점 <tspan font-size="12" font-weight="400" fill="#85858f">Point of Audition</tspan></text>
  <circle cx="418" cy="118" r="70" fill="url(#pa-zone)"/>
  <g fill="none" stroke="#7dc4dd" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.75">
    <path d="M330 82 a14 14 0 0 1 10 -10"/><path d="M322 76 a26 26 0 0 1 18 -18"/>
    <path d="M506 150 a14 14 0 0 1 -10 10"/><path d="M514 156 a26 26 0 0 1 -18 18"/>
    <path d="M500 74 a14 14 0 0 1 10 10"/><path d="M508 66 a26 26 0 0 1 18 18"/>
  </g>
  <g transform="translate(402.0 102.0) scale(1.333)" fill="none" stroke="#7dc4dd" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10a7 7 0 1 1 13 3.6a10 10 0 0 1-2 2a8 8 0 0 0-2 3a4.5 4.5 0 0 1-6.8 1.4"/><path d="M10 10a3 3 0 1 1 5 2.2"/></g>
  <text x="304" y="190" font-size="12.5" fill="#85858f">한 점이 아니라, 흐릿한 '듣기 지대'</text>

  <!-- ── 가운데: 두 층위 ── -->
  <rect x="10" y="222" width="264" height="226" rx="20" fill="#2f8fef" fill-opacity="0.06" stroke="#2f8fef" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="28" y="250" font-size="16" font-weight="700" fill="#2f8fef">공간적 청점</text>
  <text x="28" y="269" font-size="12" fill="#85858f">어디에서 듣는가</text>
  <rect x="28" y="284" width="228" height="128" rx="6" fill="none" stroke="#85858f" stroke-opacity="0.55" stroke-width="1.3"/>
  <line x1="178" y1="284" x2="178" y2="412" stroke="#85858f" stroke-opacity="0.85" stroke-width="3"/>
  <text x="178" y="279" font-size="10.5" fill="#85858f" text-anchor="middle">벽</text>
  <g transform="translate(39.0 323.0) scale(1.083)" fill="none" stroke="#2f8fef" stroke-width="1.66" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9v6h4l6 5V4L7 9z M16.5 8.5a5 5 0 0 1 0 7 M19.5 5.5a9 9 0 0 1 0 13"/></g>
  <g fill="none" stroke="#2f8fef" stroke-width="1.5" stroke-linecap="round">
    <path d="M74 323 a18 18 0 0 1 0 26" stroke-opacity="0.85"/><path d="M86 313 a32 32 0 0 1 0 46" stroke-opacity="0.65"/><path d="M98 303 a46 46 0 0 1 0 66" stroke-opacity="0.45"/>
    <path d="M188 323 a18 18 0 0 1 0 26" stroke-opacity="0.3" stroke-dasharray="3 3"/>
  </g>
  <g transform="translate(122.0 324.0) scale(1.000)" fill="none" stroke="#2f8fef" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10a7 7 0 1 1 13 3.6a10 10 0 0 1-2 2a8 8 0 0 0-2 3a4.5 4.5 0 0 1-6.8 1.4 M10 10a3 3 0 1 1 5 2.2"/></g>
  <g transform="translate(210.0 324.0) scale(1.000)" fill="none" stroke="#85858f" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10a7 7 0 1 1 13 3.6a10 10 0 0 1-2 2a8 8 0 0 0-2 3a4.5 4.5 0 0 1-6.8 1.4 M10 10a3 3 0 1 1 5 2.2"/></g>
  <g text-anchor="middle" font-size="11.5">
    <text x="134" y="380" fill="#2f8fef" font-weight="700">가까이</text><text x="134" y="396" fill="#85858f">또렷하게</text>
    <text x="222" y="380" fill="#85858f" font-weight="700">벽 너머</text><text x="222" y="396" fill="#85858f">먹먹하게</text>
  </g>

  <rect x="286" y="222" width="264" height="226" rx="20" fill="#e0a35c" fill-opacity="0.06" stroke="#e0a35c" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="304" y="250" font-size="16" font-weight="700" fill="#e0a35c">주관적 청점</text>
  <text x="304" y="269" font-size="12" fill="#85858f">누구의 자리에서 듣는가</text>
  <g transform="translate(438.0 308.0) scale(2.667)" fill="none" stroke="#e0a35c" stroke-width="0.68" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6.5" r="3.2"/><path d="M5.5 21v-3a6.5 6.5 0 0 1 13 0v3"/></g>
  <circle cx="481" cy="326" r="9" fill="none" stroke="#e0a35c" stroke-width="1.6" stroke-dasharray="3 2.5"/>
  <g transform="translate(317.0 353.0) scale(1.417)" fill="none" stroke="#85858f" stroke-width="1.27" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6.5" r="3.2"/><path d="M5.5 21v-3a6.5 6.5 0 0 1 13 0v3"/></g>
  <path d="M352 356 C 392 316, 440 302, 470 316" fill="none" stroke="#e0a35c" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#pa-a)"/>
  <text x="334" y="404" font-size="11.5" fill="#85858f" text-anchor="middle">관객</text>
  <text x="470" y="404" font-size="11.5" fill="#e0a35c" text-anchor="middle">인물</text>
  <text x="418" y="432" font-size="12.5" fill="#85858f" text-anchor="middle">관객이 인물의 귀를 빌려 듣는다</text>

  <!-- ── 아래: 청점을 빚는 방법들 ── -->
  <text x="20" y="474" font-size="14" font-weight="700" fill="#85858f">청점을 빚는 방법들</text>
  <rect x="10" y="484" width="128" height="110" rx="14" fill="#9a8fe0" fill-opacity="0.07" stroke="#9a8fe0" stroke-opacity="0.6" stroke-width="1.3"/>
  <g transform="translate(61.0 497) scale(1.083)" fill="none" stroke="#9a8fe0" stroke-width="1.66" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h16v18H4z"/><path d="M8 3v18"/><path d="M16 3v18"/><path d="M4 8h4M4 13h4M4 18h4M16 8h4M16 13h4M16 18h4"/></g>
  <g text-anchor="middle"><text x="74.0" y="544" font-size="13.5" font-weight="700" fill="#9a8fe0">편집</text>
  <text x="74.0" y="564" font-size="11.5" fill="#85858f">창가의 인물 다음</text><text x="74.0" y="580" font-size="11.5" fill="#85858f">바깥 풍경을 붙인다</text></g>
  <rect x="147" y="484" width="128" height="110" rx="14" fill="#2f8fef" fill-opacity="0.07" stroke="#2f8fef" stroke-opacity="0.6" stroke-width="1.3"/>
  <g transform="translate(198.0 497) scale(1.083)" fill="none" stroke="#2f8fef" stroke-width="1.66" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6v10a3 3 0 0 1-6 0z"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/><path d="M8.5 21h7"/></g>
  <g text-anchor="middle"><text x="211.0" y="544" font-size="13.5" font-weight="700" fill="#2f8fef">마이크의 지향성</text>
  <text x="211.0" y="564" font-size="11.5" fill="#85858f">어디로 겨누는가</text><text x="211.0" y="580" font-size="11.5" fill="#85858f">〈아라가네〉</text></g>
  <rect x="284" y="484" width="128" height="110" rx="14" fill="#7dc4dd" fill-opacity="0.07" stroke="#7dc4dd" stroke-opacity="0.6" stroke-width="1.3"/>
  <g transform="translate(335.0 497) scale(1.083)" fill="none" stroke="#7dc4dd" stroke-width="1.66" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><path d="M4 15h3v6H5a1 1 0 0 1-1-1z"/><path d="M20 15h-3v6h2a1 1 0 0 0 1-1z"/></g>
  <g text-anchor="middle"><text x="348.0" y="544" font-size="13.5" font-weight="700" fill="#7dc4dd">헤드폰 바이노럴</text>
  <text x="348.0" y="564" font-size="11.5" fill="#85858f">각자의 머릿속으로</text><text x="348.0" y="580" font-size="11.5" fill="#85858f">〈만남〉</text></g>
  <rect x="421" y="484" width="128" height="110" rx="14" fill="#e0a35c" fill-opacity="0.07" stroke="#e0a35c" stroke-opacity="0.6" stroke-width="1.3"/>
  <g transform="translate(472.0 497) scale(1.083)" fill="#e0a35c" fill-opacity="0.9" stroke="none"><g transform="rotate(-12 7.6 13.6)"><path d="M7.6 5.3999999999999995 C 11.0 5.3999999999999995 11.2 10.0 10.2 13.0 C 9.5 15.0 5.699999999999999 15.0 5.0 13.0 C 3.9999999999999996 10.0 4.199999999999999 5.3999999999999995 7.6 5.3999999999999995 Z"/><ellipse cx="7.6" cy="18.799999999999997" rx="2.3" ry="2.6"/></g><g transform="rotate(10 16.4 7.6)"><path d="M16.4 -0.6000000000000005 C 19.799999999999997 -0.6000000000000005 20.0 3.9999999999999996 19.0 7.0 C 18.299999999999997 9.0 14.499999999999998 9.0 13.799999999999999 7.0 C 12.799999999999999 3.9999999999999996 12.999999999999998 -0.6000000000000005 16.4 -0.6000000000000005 Z"/><ellipse cx="16.4" cy="12.799999999999999" rx="2.3" ry="2.6"/></g></g>
  <g text-anchor="middle"><text x="485.0" y="544" font-size="13.5" font-weight="700" fill="#e0a35c">걷는 몸</text>
  <text x="485.0" y="564" font-size="11.5" fill="#85858f">듣는 자리가</text><text x="485.0" y="580" font-size="11.5" fill="#85858f">걷는 몸 위로</text></g>
</svg>
