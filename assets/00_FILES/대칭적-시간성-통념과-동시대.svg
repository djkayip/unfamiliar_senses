<svg xmlns="http://www.w3.org/2000/svg" width="560" height="226" viewBox="0 0 560 226" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <title>대칭적 시간성: 통념과 동시대의 시간</title>
  <desc>통념은 과거를 확정된 것(실선), 미래를 열린 것(점선)으로 여긴다. 동시대에는 이 성질이 거울처럼 맞바뀌어, 과거가 변동하고(물결선) 미래가 확정된다(실선). 현재를 기준으로 과거와 미래가 고정과 유동을 서로 바꿔 갖는다.</desc>
  <defs>
    <marker id="st-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e0a35c"/>
    </marker>
  </defs>

  <!-- ── 통념 ── -->
  <path d="M92 50 L292 50" fill="none" stroke="#9a8fe0" stroke-width="4" stroke-linecap="round"/>
  <path d="M308 50 L528 50" fill="none" stroke="#7dc4dd" stroke-width="2.2" stroke-dasharray="6 6" stroke-linecap="round"/>
  <circle cx="300" cy="50" r="7" fill="#85858f"/>

  <!-- 맞바뀜 -->
  <g fill="none" stroke="#e0a35c" stroke-width="2.2" stroke-linecap="round" marker-end="url(#st-arrow)">
    <path d="M192 84 L192 139"/>
    <path d="M418 84 L418 139"/>
  </g>

  <!-- ── 동시대 ── -->
  <path transform="translate(92 176)" d="M0.0 10.0 L4.2 6.3 L8.3 4.2 L12.5 4.5 L16.7 7.0 L20.8 10.8 L25.0 14.2 L29.2 15.9 L33.3 15.2 L37.5 12.3 L41.7 8.4 L45.8 5.2 L50.0 4.0 L54.2 5.2 L58.3 8.4 L62.5 12.3 L66.7 15.2 L70.8 15.9 L75.0 14.2 L79.2 10.8 L83.3 7.0 L87.5 4.5 L91.7 4.2 L95.8 6.3 L100.0 10.0 L104.2 13.7 L108.3 15.8 L112.5 15.5 L116.7 13.0 L120.8 9.2 L125.0 5.8 L129.2 4.1 L133.3 4.8 L137.5 7.7 L141.7 11.6 L145.8 14.8 L150.0 16.0 L154.2 14.8 L158.3 11.6 L162.5 7.7 L166.7 4.8 L170.8 4.1 L175.0 5.8 L179.2 9.2 L183.3 13.0 L187.5 15.5 L191.7 15.8 L195.8 13.7 L200.0 10.0" fill="none" stroke="#7dc4dd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M308 186 L528 186" fill="none" stroke="#9a8fe0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="300" cy="186" r="7" fill="#85858f"/>

  <g font-size="14" font-weight="700" fill="#85858f">
    <text x="10" y="53">통념</text>
    <text x="10" y="189">동시대</text>
  </g>
  <g font-size="16" font-weight="700" text-anchor="middle">
    <text x="192" y="29" fill="#9a8fe0">과거 · 확정</text>
    <text x="418" y="29" fill="#7dc4dd">미래 · 열림</text>
    <text x="192" y="165" fill="#7dc4dd">과거 · 변동</text>
    <text x="418" y="165" fill="#9a8fe0">미래 · 확정</text>
  </g>
  <g font-size="12" fill="#85858f" text-anchor="middle">
    <text x="300" y="73">현재</text>
    <text x="300" y="209">현재</text>
  </g>
</svg>
