  <title>맥놀이: 주파수가 조금 다른 두 소리의 간섭</title>
  <desc>주파수가 조금 다른 두 소리 f₁(440Hz)와 f₂(442Hz)가 겹치면 보강(커짐)과 상쇄(작아짐)가 번갈아 일어나 음량이 출렁인다. 두 주파수의 차이 2Hz만큼, 1초에 두 번(0.5초마다) 출렁인다. 파형의 진동 수는 그림을 위해 줄였고, 출렁임의 비율은 실제와 같다.</desc>

